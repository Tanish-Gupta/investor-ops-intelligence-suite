# Investor Ops & Intelligence Suite: "Linen & Caramel". Cream linen canvas, bold serif headings,
# caramel pill buttons, raised card stock (shadows live in dashboard/theme.py). System fonts only
# so the app stays offline.

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#9A5B2C"
backgroundColor = "#F6F1EA"
secondaryBackgroundColor = "#EFE7DC"
textColor = "#2B2722"
linkColor = "#8A4F24"
linkUnderline = true
borderColor = "#E2D6C6"
dataframeBorderColor = "#E2D6C6"
dataframeHeaderBackgroundColor = "#F8F3EC"
font = "-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Roboto, Helvetica Neue, Arial, sans-serif"
headingFont = "Iowan Old Style, Palatino Linotype, Charter, Bitstream Charter, Georgia, serif"
headingFontWeights = [700, 700, 700, 650, 650, 650]
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
baseFontSize = 15
baseRadius = "0.85rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
greenColor = "#4A7354"
orangeColor = "#85570A"
redColor = "#A3341F"
blueColor = "#535FA0"
violetColor = "#535FA0"
chartCategoricalColors = ["#9A5B2C", "#4A7354", "#535FA0", "#85570A", "#6B6158"]
